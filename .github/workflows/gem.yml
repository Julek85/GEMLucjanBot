name: GEM Monthly Alert

on:
  schedule:
    - cron: "15 12 1 * *"   # 1 dzień miesiąca, 12:15 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gem_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance

      - name: Run GEM Bot
        env:
          GEM_TICKERS_JSON: ${{ secrets.GEM_TICKERS_JSON }}
          GEM_RISK_ASSETS_JSON: ${{ secrets.GEM_RISK_ASSETS_JSON }}
          GEM_BONDS_NAME: ${{ secrets.GEM_BONDS_NAME }}
          GEM_CAPITAL_EUR: ${{ secrets.GEM_CAPITAL_EUR }}
        run: python gem_bot.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f state.json ] && git add state.json || true
          [ -f gem_message.txt ] && git add gem_message.txt || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update GEM state and report [skip ci]"
          git push

      - name: Send Telegram Alert
        if: always()
        run: |
          test -f gem_message.txt || echo "🔴 GEM Bot Error: Nie wygenerowano raportu!" > gem_message.txt
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
               -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
               --data-urlencode "text@gem_message.txt"
