name: GEM Monthly Alert
on:
  schedule:
    - cron: "15 12 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gem_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-python: "3.11"
      - run: pip install pandas yfinance
      - name: Run GEM Bot
        env:
          GEM_TICKERS_JSON: ${{ secrets.GEM_TICKERS_JSON }}
          GEM_RISK_ASSETS_JSON: ${{ secrets.GEM_RISK_ASSETS_JSON }}
          GEM_BONDS_NAME: ${{ secrets.GEM_BONDS_NAME }}
          GEM_CAPITAL_EUR: ${{ secrets.GEM_CAPITAL_EUR }}
        run: python gem_bot.py
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json gem_message.txt || true
          git commit -m "Update state [skip ci]" || echo "No changes"
          git push || echo "Push failed"
      - name: Telegram
        if: always()
        run: |
          [ -f gem_message.txt ] || echo "Błąd bota" > gem_message.txt
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
               -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" --data-urlencode "text@gem_message.txt"
