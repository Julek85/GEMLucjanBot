name: GEM Monthly Alert

on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 1 * *'

permissions:
  contents: write

concurrency:
  group: gem-monthly-alert
  cancel-in-progress: true

jobs:
  gem_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run GEM Bot
        run: python gem_bot.py
        env:
          GEM_TICKERS_JSON: '{"USA (VUAA)": "VUAA.L", "DM ex-US (EXUS)": "EXUS.L", "EM (Vanguard FTSE EM Acc)": "VFEG.L", "BONDS (AGGH)": "AGGH.L"}'
          GEM_RISK_ASSETS_JSON: '["USA (VUAA)", "DM ex-US (EXUS)", "EM (Vanguard FTSE EM Acc)"]'
          GEM_BONDS_NAME: 'BONDS (AGGH)'
          GEM_CAPITAL_EUR: '583'

      # ✅ COMMIT TYLKO NA CRON — ręczne testy NIC nie zapisują
      - name: Commit and push state.json
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add state.json
          git diff --cached --quiet || git commit -m "Update GEM state.json [skip ci]"
          git push

      - name: Send Telegram Alert
        if: always()
        run: |
          test -f gem_message.txt || echo "GEM Bot: run zakończony błędem. Sprawdź logi GitHub Actions." > gem_message.txt
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
               -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
               --data-urlencode "text@gem_message.txt"
